# DNS 防泄漏配置（zks-core）
#
# 目标：本地系统 DNS 不再接触代理目标，且**解析位置跟随连接出口**：
#   - 走代理的域名 → `tunnel://`（DnsQuery 帧 → Worker DoH，解析在出口侧）
#   - 规则判定直连的域名 → `direct-nameserver`（国内 DoH，CDN 返回本地节点）
#   - 其它/未知 → `nameserver`
#
# 为什么要分 direct / proxy 两组：Cloudflare 香港 POP 解析国内域名的 .com 站
# 会返回海外/非最优 CDN IP，直连过去自然慢甚至白屏。直连流量从本地出去，
# 就该用本地 DNS 解析。
#
# 字段说明（clash 风格 kebab-case；未知字段会在启动期报错）：
#   listen                  本地 DNS 监听地址（UDP+TCP）。注释掉/删除则不开监听器。
#   ipv6                    是否解析/返回 AAAA。false 时 AAAA 查询回空 NOERROR。
#   default-nameserver      引导 DNS：**必须**是字面 IP 的 DoH（配置期校验），
#                           用于解析 nameserver 里带域名的 DoH 端点。
#   proxy-server-nameserver 解析 worker 域名用的 DoH（必须字面 IP）。
#                           缺省用 default-nameserver；避免系统 DNS 看到 worker 域名。
#   nameserver              默认/未知上游：tunnel:// / https://.../dns-query / system://
#   direct-nameserver       路由判定 DIRECT 的域名所用上游（国内 DoH，推荐）
#   proxy-nameserver        路由判定 PROXY 的域名所用上游（缺省同 nameserver）
#   nameserver-policy       可选分域覆盖（优先级最高）：域名后缀 → 上游
#   fallback-system         上游全败时是否回退系统 DNS。默认 false（防泄漏 fail-closed）。
#   forbidden-ranges        额外禁区段（自动含 198.18.0.0/15 fake-ip 预留段）

listen: "127.0.0.1:1053"

ipv6: false

# 引导 DNS：只允许字面 IP 的 DoH（官方支持 IP 端点 + IP SAN）
default-nameserver:
  - "https://223.5.5.5/dns-query"

# 建立隧道前解析 worker 域名；缺省用 default-nameserver
proxy-server-nameserver:
  - "https://223.5.5.5/dns-query"

# 默认/未知目标：全部经隧道 → Worker DoH（与代理出口一致）
nameserver:
  - "tunnel://"

# 路由判定直连的域名：用国内 DoH 解析，保证 CDN 返回本地/就近节点
# 这是"国内打开慢/白页面"的主要修复项。
direct-nameserver:
  - "https://223.5.5.5/dns-query"
  # - "https://doh.pub/dns-query"   # 腾讯 DoH（域名端点，经 default-nameserver 引导）

# 路由判定走代理的域名：缺省同 nameserver（tunnel://）
# proxy-nameserver:
#   - "tunnel://"

nameserver-policy:
  # 显式分域例外（优先级最高）。大多数场景不需要 —— direct-nameserver
  # 会跟随路由自动生效，不必枚举域名。
  # "+.cn": "https://223.5.5.5/dns-query"

fallback-system: false

# 额外禁区段（示例：把自定义 fake-ip/保留段也视为不可返回）
# forbidden-ranges:
#   - "198.18.0.0/15"
