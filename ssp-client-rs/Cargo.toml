[package]
name = "ssp-rs"
version = "1.4.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# Crypto
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.10"
sha2 = "0.10"
base64 = "0.22"
hkdf = "0.12"

# Network - async-tungstenite with native-tls (simplest setup)
async-tungstenite = { version = "0.34", features = [
  "tokio-runtime",
  "tokio-native-tls",
] }
tokio-native-tls = "0.3"
futures-util = "0.3"
native-tls = "0.2"
bytes = "1.11.1"

# HTTP Client (for downloading routing rules)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
maxminddb = "0.27"

# Misc
once_cell = "1.21.4"
parking_lot = "0.12"


# rules
ahash = "0.8"
ipnetwork = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
arc-swap = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
regex = "1"

[profile.release]
lto = true
opt-level = 3
strip = true
