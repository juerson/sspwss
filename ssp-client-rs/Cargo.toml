[package]
name = "ssp-rs"
version = "1.4.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# Crypto
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.10"
sha2 = "0.10"
base64 = "0.23"
hkdf = "0.12"

# Network - async-tungstenite with native-tls (simplest setup)
async-tungstenite = { version = "0.35", features = [
  "tokio-runtime",
  "tokio-native-tls",
] }
tokio-native-tls = "0.3"
futures-util = "0.3"
native-tls = "0.2"
bytes = "1.12"

# HTTP Client (for downloading routing rules)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
maxminddb = "0.33"

# Misc
once_cell = "1.21.4"
parking_lot = "0.13"


# rules
ahash = "0.8"
ipnetwork = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
arc-swap = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
regex = "1"

# DNS 防泄漏（wire 报文构造/解析，全程无 UDP 上游依赖）
hickory-proto = "0.25"

# .mrs 规则集解压（纯 Rust zstd，避免引入 C 工具链）
ruzstd = "0.9"

# ECH 路径需要 rustls；native-tls 保留给 --ech off / auto 回退
rustls = "0.23"
rustls-platform-verifier = "0.7"
tokio-rustls = "0.26"

[profile.release]
lto = true
opt-level = 3
strip = true
